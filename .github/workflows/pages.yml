name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package updated standalone HTML as a ZIP
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("downloads/mightora-har-offline.zip", "w", compression=ZIP_DEFLATED) as z:
              z.write("downloads/har-analyser.html", arcname="har-analyser.html")
              z.write("downloads/README-OFFLINE.txt", arcname="README.txt")
              z.write("LICENSE", arcname="LICENSE.txt")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4