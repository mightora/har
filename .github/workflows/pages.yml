name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build offline HTML and ZIP from shared code
        run: |
          node scripts/build-offline.mjs
          python3 scripts/package-offline.py
      - name: Run regression tests before deploying
        run: npm test
      - name: Bundle shared Mightora footer
        uses: mightora/shared-ui/.github/actions/sync-footer@main
        with:
          output-directory: .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
